name: Life Info Blogger Automation
on:
  workflow_dispatch:
    inputs:
      task:
        description: '콘텐츠 분야'
        required: true
        type: choice
        options: [auto, living, finance, travel, economy]
        default: auto
      dry_run:
        description: '미리보기만 생성 (발행 안 함)'
        required: true
        type: boolean
        default: true
  schedule:
    - cron: '30 0 * * 1,3,5' # 월·수·금 KST 09:30
permissions:
  contents: read
concurrency:
  group: life-info-blog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BLOG_URL: ${{ secrets.BLOG_URL }}
      BLOG_NAME: ${{ vars.BLOG_NAME }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-120b
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
      TASK: auto
      DRY_RUN: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set run options
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "TASK=${{ inputs.task }}" >> "$GITHUB_ENV"
            echo "DRY_RUN=${{ inputs.dry_run }}" >> "$GITHUB_ENV"
          else
            echo 'TASK=auto' >> "$GITHUB_ENV"
            echo 'DRY_RUN=false' >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Research, write, quality-check and publish
        run: python main.py
      - name: Upload previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-info-preview-${{ github.run_id }}
          path: |
            preview_life_*.html
            preview_life_*.json
          if-no-files-found: ignore
          retention-days: 14
